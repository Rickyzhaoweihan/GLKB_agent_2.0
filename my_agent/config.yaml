# -------------------------------------------------------
# GLKB Agent Configuration
# Edit this file to change models, paths, and memory tuning.
# Secrets (API keys, DB credentials) stay in .env.
# -------------------------------------------------------

# Main agent model (used by the ADK LlmAgent)
agent:
  model: "openai/gpt-5.2"
  api_base: "https://api.openai.com/v1"

# Output paths (relative to the repo root)
paths:
  log_dir: "agent_logs"
  layermem_db: "agent_logs/layermem.db"

# LayerMem memory system
memory:
  # Set to true to enable persistent hierarchical memory
  enabled: false

  # LLM used for topic-boundary detection and memory inference
  # This is intentionally separate from the agent model above
  llm_model: "openai/gpt-oss-120b:free"
  llm_api_base: "https://openrouter.ai/api/v1"

  # Embedding model for vector search within LayerMem
  embedding_model: "nvidia/llama-nemotron-embed-vl-1b-v2:free"
  embedding_dimensions: 2048

  # How many chars of the agent reply are included in the boundary-check prompt
  agent_text_limit: 300

  # Run memory consolidation every N episode flushes
  consolidate_every_n_flushes: 10

